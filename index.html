<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="SUNSET - offline cryptographic posture and post-quantum migration triage. Turns a cryptographic inventory into a deadline-anchored, risk-ranked migration plan."
    />
    <title>SUNSET / cryptographic migration triage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M4 21h24' stroke='%23F0A03C' stroke-width='2'/%3E%3Cpath d='M4 25h24M4 28h24' stroke='%232E333D' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='13' r='6' fill='none' stroke='%23E9E6E0' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('sunset.settings') || '{}');
          var t = s.theme;
          if (t === 'system' || !t) {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (s.reduceMotion) document.documentElement.setAttribute('data-reduce-motion', 'true');
        } catch (e) {
          /* first run, or storage unavailable: the dark default in the markup stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      SUNSET runs its analysis engine in the browser and requires JavaScript. No network access
      is used at any point.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
